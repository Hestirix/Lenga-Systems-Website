kind = "web"
previewPath = "/"
title = "Lenga Systems"
version = "1.0.0"
id = "artifacts/lenga-systems"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18378

[services.development]
run = "pnpm --filter @workspace/lenga-systems run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lenga-systems", "run", "build" ]
publicDir = "artifacts/lenga-systems/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18378"
BASE_PATH = "/"
